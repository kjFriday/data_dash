[package]
name = "data_dash"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "ACME Inc. dashboard: Rust compiled to WebAssembly, charting the CRUD hub's data and two fixture files."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlSelectElement", "Event",
  "EventTarget", "Location", "Request", "RequestInit", "Response", "console",
] }

[profile.release]
opt-level = "s"
lto = true
