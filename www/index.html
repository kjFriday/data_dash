<!--
  The page shell of the dashboard; src/web.rs fills it in.
  The desktop program serves this folder over its own generic-company:// protocol; a plain web
  server works too, with the mock snapshot. main.js loads the WebAssembly build (pkg/, made by
  wasm-pack) and starts src/web.rs, which renders both tabs into the empty containers below.
  Every id here is looked up by web.rs, which stops with "#id missing" if one is gone:
  tab-business, tab-fixtures, mode, source, reload, change-db, about (header controls);
  business, fixtures, fixture-charts, class-filter, number-table (tab contents); status, version
  (footer). main.rs's smoke check also reads #status and counts the svg charts in #business.
  The source option values: "hub" is the shared database (the value dates from when the CRUD hub
  served /api; web.rs DB_OPTION matches it), "mock" the bundled snapshot.
  The title is the window's page title in the smoke report.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generic Company Inc. Data Dash</title>
  <link rel="icon" href="favicon.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="viz-root">
  <header class="top">
    <h1><img class="px" src="favicon.png" width="32" height="32" alt="">Generic Company Inc. <span>Data Dash</span></h1>
    <nav class="tabs" role="tablist">
      <button id="tab-business" role="tab" aria-selected="true" type="button">Business</button>
      <button id="tab-fixtures" role="tab" aria-selected="false" type="button">Numbers &amp; tracks</button>
    </nav>
    <span id="mode" class="badge">mock</span>
    <label>Data
      <select id="source">
        <option value="hub">Shared database</option>
        <option value="mock">Mock snapshot</option>
      </select>
    </label>
    <button id="reload" type="button">Reload</button>
    <button id="change-db" type="button">Database…</button>
    <button id="about" type="button">About</button>
  </header>

  <main>
    <div id="business"><p class="loading">Loading WebAssembly ...</p></div>
    <div id="fixtures" hidden>
      <div id="fixture-charts"></div>
      <section class="card wide">
        <h2>All 100 numbers</h2>
        <p class="sub">Table view; filter by a class tagged on Wikidata</p>
        <input id="class-filter" type="search" placeholder="Filter by class, e.g. prime number">
        <div id="number-table"></div>
      </section>
    </div>
  </main>

  <footer><output id="status"></output><span id="version" class="version"></span></footer>
  <script type="module" src="main.js"></script>
</body>
</html>
